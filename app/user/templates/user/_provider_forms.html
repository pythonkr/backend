<form method="post" action="{{ redirect_url }}">
  {% csrf_token %}
  <input type="hidden" name="callback_url" value="{{ callback_url }}" />
  <input type="hidden" name="process" value="{{ process }}" />
  {% for provider in providers %}
    <button class="provider provider-{{ provider.id }}" name="provider" value="{{ provider.id }}">
      {% if provider.id == "google" %}
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      {% elif provider.id == "naver" %}
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M16.3 3v9.4L8.4 3H3v18h5.7v-9.4L16.6 21H21V3z"/></svg>
      {% elif provider.id == "kakao" %}
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3.4C6.9 3.4 2.8 6.6 2.8 10.6c0 2.5 1.7 4.8 4.3 6.1-.2.7-.7 2.5-.8 2.9-.1.5.2.5.4.4.2-.1 2.5-1.7 3.5-2.4.5.1 1.1.1 1.6.1 5.1 0 9.2-3.2 9.2-7.2S17.1 3.4 12 3.4z"/></svg>
      {% endif %}
      <span>
        {% if en %}
          {% if process == "login" %}Sign in with {{ provider.name_en }}{% else %}Continue with {{ provider.name_en }}{% endif %}
        {% else %}
          {{ provider.name_ko }}로 {% if process == "login" %}로그인{% else %}인증{% endif %}
        {% endif %}
      </span>
    </button>
  {% endfor %}
</form>
