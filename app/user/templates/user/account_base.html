{% is_english as en %}<!DOCTYPE html>
<html lang="{% if en %}en{% else %}ko-kr{% endif %}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{% block title %}{% if en %}Account · PyCon Korea{% else %}계정 · PyCon Korea{% endif %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="https://static.pycon.kr/pycon-korea/logo/logo.svg" />
  <link rel="stylesheet" href="https://unpkg.com/mvp.css" />
  <style>
    section aside { width: 100%; max-width: 520px; margin: 2rem auto; text-align: left; }
    form { border: 0; box-shadow: none; padding: 0; margin: 0; min-width: 0; max-width: none; }
    button { padding: .55rem 1.2rem; }
    button.provider { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; }
    .provider svg { flex-shrink: 0; }
    .provider-google { background: #fff; color: #1f1f1f; border-color: #dadce0; }
    .provider-google:hover { background: #f7f8f8; color: #1f1f1f; border-color: #e0e2e6; filter: none; }
    .provider-naver { background: #03C75A; color: #fff; border-color: #03C75A; }
    .provider-kakao { background: #FEE500; color: #000; border-color: #FEE500; }
    .provider-email { background: #f5f5f5; color: #1f1f1f; border-color: #dadce0; }
    .provider-email:hover { background: #fafafa; color: #1f1f1f; border-color: #e0e2e6; filter: none; }
    .kv { margin: .3rem 0; }
    .kv small { color: #888; }
    .error { margin: 1rem 0; padding: .8rem 1rem; border-left: 4px solid #b23b3b;
      background: #fdecec; color: #b23b3b; border-radius: .3rem; }
    .notice { margin: 1rem 0; padding: .8rem 1rem; border-left: 4px solid #2e7d32;
      background: #eaf6ec; color: #2e7d32; border-radius: .3rem; }
    .muted { color: #888; }
    .ok-text { color: #2e7d32; }
    .or { text-align: center; color: #aaa; margin: 1rem 0; }
    table.emails { display: table; table-layout: fixed; width: 100%; margin: 1rem 0; white-space: normal; overflow-x: visible; }
    table.emails td { vertical-align: middle; padding: .5rem .6rem; word-break: break-word; }
    table.emails .badges { margin-top: .15rem; }
    table.emails .badges sup { margin-right: .3rem; }
    table.emails td.actions { width: 9rem; }
    table.emails .btns { display: flex; gap: .3rem; justify-content: flex-end; }
    table.emails .btns form { display: contents; }
    table.emails .btns button { flex-shrink: 0; white-space: nowrap; }
    table.emails .btns .action-btn { width: 5rem; }
    html[lang="en"] table.emails td.actions { width: 12.5rem; }
    html[lang="en"] table.emails .btns .action-btn { width: 7rem; }
    button.sm { padding: .28rem .7rem; font-size: .8rem; margin: 0; }
    button.danger { background: #b23b3b; border-color: #b23b3b; }
    .add-email { display: flex; gap: .5rem; align-items: stretch; }
    .add-email input { flex: 1; margin: 0; }
    .add-email button { margin: 0; }
    .home-actions { display: flex; flex-direction: column; gap: .75rem; margin-top: 1.5rem; }
    .home-actions form { margin: 0; }
    .btn-outline {
      display: block; width: 100%; box-sizing: border-box; margin: 0;
      padding: 1rem 2rem; border: 2px solid var(--color-link); border-radius: var(--border-radius);
      background: transparent; color: var(--color-link);
      font-family: inherit; font-size: medium; font-weight: bold; font-style: italic; line-height: var(--line-height);
      text-align: center; text-decoration: none; cursor: pointer;
    }
    .btn-outline:hover { background: var(--color-link); color: var(--color-bg); filter: none; }
    .btn-outline.danger { background: transparent; border-color: #b23b3b; color: #b23b3b; }
    .btn-outline.danger:hover { background: #b23b3b; color: var(--color-bg); }
  </style>
</head>
<body>
  <main>
    <section><aside>
      {% block body %}{% endblock %}
    </aside></section>
  </main>
</body>
</html>
